http:
  global_concurrency: 10
  per_domain_concurrency: 1
  connect_timeout: 5
  read_timeout: 10
  max_redirects: 5
  retry: 1
  max_response_size: 2097152
  max_js_files: 3
  user_agent: OpenWeb-KR-Research/1.0 (+public-pages-only)
korea:
  confirmed: 5
  possible: 3
  hangul_ratio: 0.15
collectors:
  # General/custom domains are the default. Hosted-platform CT collection is opt-in.
  search: true
  search_provider: brave
  search_queries:
    - '"Generated by Lovable" 한국'
    - '"/~flock.js" 한국'
    - '"Built with v0" 한국'
    - '"Made with Manus" 한국'
    - 'site:kr (Lovable OR "v0.dev" OR Replit OR Base44)'
  github: true
  github_queries:
    - 'lovable 한국 in:name,description,readme'
    - 'lovable korea in:name,description,readme'
    - 'v0 한국 in:name,description,readme'
    - 'base44 한국 in:name,description,readme'
  ct: false
  excluded_domain_suffixes:
    - lovable.app
    - vercel.app
    - github.io
    - github.com
    - githubusercontent.com
    - githubassets.com
    - githubapp.com
    - netlify.app
    - pages.dev
    - replit.app
    - base44.app
  commoncrawl: false
  public_files: []
  ct_queries: ["%.lovable.app"]
  commoncrawl_index: latest
  commoncrawl_queries: ["*.lovable.app/*"]
